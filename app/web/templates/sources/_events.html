{% if events %}
<div class="table-wrap">
<table>
  <thead><tr><th>Starts</th><th>Title</th><th>Location</th></tr></thead>
  <tbody>
  {% for event in events %}
    <tr><td><time data-local datetime="{{ event.start_utc.isoformat() }}">{{ event.start_utc | utc }}</time></td><td>{{ event.title }}</td><td>{{ event.location or "" }}</td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% else %}<p class="muted small">None.</p>{% endif %}
