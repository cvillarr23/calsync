site_name: calsync
site_description: Sync community calendars into Google Calendar or an .ics feed.
site_url: https://cvillarr23.github.io/calsync/
repo_url: https://github.com/cvillarr23/calsync
repo_name: cvillarr23/calsync

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Configuration: configuration.md
  - Google OAuth: google-oauth.md
  - Reverse proxy: reverse-proxy.md
  - Adapters:
      - Overview: adapters/index.md
      - Pipeline kind: adapters/pipeline.md
      - HTML kind: adapters/html.md
